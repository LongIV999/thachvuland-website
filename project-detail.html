<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
    <title>Chi Tiết Dự Án - Thạch Vũ Land</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Be+Vietnam+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="styles/main.css">
    <style>
        /* Detail Page Specific Styles */
        .project-hero {
            height: 70vh;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding-bottom: 60px;
            overflow: hidden;
        }

        .project-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.3), rgba(12, 12, 12, 1));
            z-index: 1;
        }

        .project-hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            /* Parallax effect can be added here */
        }

        .project-hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .detail-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 50px;
            padding: 60px 0;
        }

        @media (max-width: 992px) {
            .detail-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Content Styles */
        .project-description {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--neutral-300);
            margin-bottom: 40px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            border-color: var(--accent-gold);
            transform: translateY(-5px);
        }

        .feature-item i {
            color: var(--accent-gold);
            font-size: 1.2rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .gallery-grid img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gallery-grid img:hover {
            transform: scale(1.02);
        }

        /* Sidebar Styles */
        .project-sidebar {
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .sidebar-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--neutral-400);
        }

        .info-value {
            font-weight: 600;
            color: white;
            text-align: right;
        }

        .sidebar-form input,
        .sidebar-form textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            color: white;
            font-family: var(--font-body);
        }

        .sidebar-form input:focus,
        .sidebar-form textarea:focus {
            border-color: var(--accent-gold);
            outline: none;
        }

        .price-tag {
            font-size: 2rem;
            color: var(--accent-gold);
            font-family: var(--font-heading);
            font-weight: 700;
            margin-bottom: 20px;
            display: block;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="site-header scrolled" id="siteHeader">
        <div class="header-container">
            <a href="index.html" class="logo">
                <svg width="120" height="48" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
                    <style>
                        .tvl-text {
                            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                            font-weight: 800;
                            letter-spacing: 0.05em;
                            fill: currentColor;
                            text-anchor: middle;
                            dominant-baseline: middle;
                        }
                    </style>
                    <text x="50%" y="50%" font-size="48" class="tvl-text">TVL</text>
                </svg>
            </a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Trang Chủ</a></li>
                    <li><a href="projects.html" class="active">Dự Án</a></li>
                    <li><a href="index.html#news">Tin Tức</a></li>
                    <li><a href="index.html#about">Về Chúng Tôi</a></li>
                    <li><a href="index.html#contact">Liên Hệ</a></li>
                </ul>
            </nav>
            <div class="header-cta">
                <a href="tel:0903469888" class="header-phone">
                    <i class="fas fa-phone"></i>
                    <span>0903.469.888</span>
                </a>
            </div>

            <button class="mobile-menu-toggle" id="mobileMenuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
        <ul>
            <li><a href="index.html">Trang Chủ</a></li>
            <li><a href="projects.html">Dự Án</a></li>
            <li><a href="index.html#news">Tin Tức</a></li>
            <li><a href="index.html#about">Về Chúng Tôi</a></li>
            <li><a href="index.html#contact">Liên Hệ</a></li>
        </ul>
        <div class="mobile-menu-contact">
            <a href="tel:0903469888" class="btn-primary">
                <i class="fas fa-phone"></i> Gọi Ngay
            </a>
        </div>
    </div>

    <!-- Project Content (Injected via JS) -->
    <div id="projectDetailContainer">
        <!-- Schema:
            - Hero Section
            - Main Content (Desc, Features, Gallery) vs Sidebar (Info, Form)
        -->
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Thạch Vũ Land. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Scripts -->
    <script src="scripts/data.js"></script>
    <script src="scripts/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = parseInt(urlParams.get('id'));

            // Find project
            const project = projectData.find(p => p.id === projectId);

            if (!project) {
                document.getElementById('projectDetailContainer').innerHTML = `
                    <div style="height: 80vh; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; background: radial-gradient(circle at center, rgba(197, 160, 89, 0.05) 0%, transparent 70%);">
                        <div class="glass-morphism" style="padding: 60px; border-radius: 24px; max-width: 500px; border: 1px solid rgba(197, 160, 89, 0.2);">
                            <i class="fas fa-search-location" style="font-size: 4rem; color: var(--accent-gold); margin-bottom: 30px;"></i>
                            <h2 class="text-gradient" style="font-size: 2.5rem; margin-bottom: 20px;">Dự án không tồn tại</h2>
                            <p style="color: var(--neutral-400); margin-bottom: 30px; font-size: 1.1rem;">Rất tiếc, chúng tôi không tìm thấy thông tin chi tiết cho dự án này hoặc đường dẫn đã thay đổi.</p>
                            <a href="projects.html" class="btn-primary" style="display: inline-block;">Quay lại danh sách</a>
                        </div>
                    </div>
                `;
                return;
            }

            // Render Function
            renderProjectDetail(project);
        });

        function renderProjectDetail(project) {
            const container = document.getElementById('projectDetailContainer');

            // Generate Features HTML
            const featuresHtml = project.features ? project.features.map(f => `
                <div class="feature-item">
                    <i class="fas fa-check-circle"></i>
                    <span>${f}</span>
                </div>
            `).join('') : '';

            // Generate Gallery HTML
            const galleryHtml = project.gallery ? project.gallery.map(img => `
                <img src="${img}" loading="lazy" alt="${project.title} Gallery">
            `).join('') : '';

            container.innerHTML = `
                <!-- Hero -->
                <section class="project-hero">
                    <img src="${project.image}" class="project-hero-bg" alt="${project.title} cover">
                    <div class="container project-hero-content">
                        <span class="badge neon-glow" style="margin-bottom: 15px; display: inline-block;">${project.status}</span>
                        <h1 class="text-gradient" style="font-size: 3.5rem; line-height: 1.2; max-width: 800px;">${project.title}</h1>
                        <p style="font-size: 1.2rem; margin-top: 15px; opacity: 0.9;"><i class="fas fa-map-marker-alt" style="color: var(--accent-gold);"></i> ${project.location}</p>
                    </div>
                </section>

                <!-- Content -->
                <section class="container detail-layout">
                    <!-- Left Column -->
                    <div class="detail-main">
                        <h2 class="section-title">Tổng Quan</h2>
                        <div class="project-description">
                            ${project.description || 'Đang cập nhật mô tả chi tiết cho dự án này.'}
                        </div>

                        ${featuresHtml ? `
                        <h3 class="section-title" style="font-size: 1.8rem; margin-top: 50px;">Tiện Ích Nổi Bật</h3>
                        <div class="features-grid">
                            ${featuresHtml}
                        </div>
                        ` : ''}
                        
                        ${galleryHtml ? `
                        <h3 class="section-title" style="font-size: 1.8rem; margin-top: 50px;">Thư Viện Hình Ảnh</h3>
                        <div class="gallery-grid glass-morphism" style="padding: 20px;">
                            ${galleryHtml}
                        </div>
                        ` : ''}
                    </div>

                    <!-- Right Column (Sidebar) -->
                    <aside class="project-sidebar">
                        <div class="sidebar-card glass-morphism">
                            <span class="price-tag">${project.price}</span>
                            
                            <div class="info-row">
                                <span class="info-label">Loại hình</span>
                                <span class="info-value">${project.category === 'can-ho' ? 'Căn Hộ' : 'Shophouse'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Quy mô</span>
                                <span class="info-value">${project.specs || 'N/A'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Vị trí</span>
                                <span class="info-value" style="font-size: 0.9rem; max-width: 150px;">${project.location}</span>
                            </div>

                            <hr style="border-color: rgba(255,255,255,0.1); margin: 25px 0;">

                            <h4 style="margin-bottom: 20px; color: var(--accent-gold);">Đăng Ký Tư Vấn</h4>
                            <form class="sidebar-form" onsubmit="event.preventDefault(); alert('Cảm ơn bạn! Chúng tôi sẽ liên hệ sớm.');">
                                <input type="text" placeholder="Họ và tên *" required>
                                <input type="tel" placeholder="Số điện thoại *" required>
                                <textarea rows="3" placeholder="Lời nhắn..."></textarea>
                                <button type="submit" class="btn-primary" style="width: 100%;">Gửi Yêu Cầu</button>
                            </form>
                            
                            <div style="text-align: center; margin-top: 15px;">
                                <a href="tel:0903469888" style="color: white; font-weight: 500;"><i class="fas fa-phone-alt spin"></i> Hotline: 0903.469.888</a>
                            </div>
                        </div>
                    </aside>
                </section>
            `;

            // Init GSAP for this page
            initDetailAnimations();
        }

        function initDetailAnimations() {
            gsap.registerPlugin(ScrollTrigger);

            gsap.from(".project-hero-content > *", {
                y: 50,
                opacity: 0,
                duration: 1,
                stagger: 0.2,
                ease: "power3.out"
            });

            gsap.from(".detail-main", {
                x: -50,
                opacity: 0,
                duration: 1,
                scrollTrigger: {
                    trigger: ".detail-layout",
                    start: "top 80%"
                }
            });

            gsap.from(".project-sidebar", {
                x: 50,
                opacity: 0,
                duration: 1,
                delay: 0.3,
                scrollTrigger: {
                    trigger: ".detail-layout",
                    start: "top 80%"
                }
            });
        }
    </script>
</body>

</html>
