<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thạch Vũ Land - UI/UX Tests</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #003d33;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .test-section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .test-section h2 {
            color: #004d40;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .test-case {
            padding: 15px;
            margin: 10px 0;
            background: #f9f9f9;
            border-left: 4px solid #ddd;
            border-radius: 4px;
        }

        .test-case.pass {
            border-left-color: #10b981;
            background: #ecfdf5;
        }

        .test-case.fail {
            border-left-color: #ef4444;
            background: #fef2f2;
        }

        .test-case.warning {
            border-left-color: #f59e0b;
            background: #fffbeb;
        }

        .test-title {
            font-weight: 600;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .test-description {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }

        .test-result {
            font-size: 0.85rem;
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 4px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.pass {
            background: #10b981;
            color: white;
        }

        .badge.fail {
            background: #ef4444;
            color: white;
        }

        .badge.warning {
            background: #f59e0b;
            color: white;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .summary-number {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .summary-card.pass .summary-number {
            color: #10b981;
        }

        .summary-card.fail .summary-number {
            color: #ef4444;
        }

        .summary-card.warning .summary-number {
            color: #f59e0b;
        }

        .summary-label {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .run-tests-btn {
            background: #004d40;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.3s ease;
        }

        .run-tests-btn:hover {
            background: #003d33;
        }

        .code {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
            margin-top: 10px;
        }

        .recommendations {
            background: #fffbeb;
            border: 1px solid #fbbf24;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .recommendations h3 {
            color: #92400e;
            margin-bottom: 15px;
        }

        .recommendations ul {
            list-style: none;
            padding-left: 0;
        }

        .recommendations li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }

        .recommendations li:before {
            content: "→";
            position: absolute;
            left: 0;
            color: #f59e0b;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Thạch Vũ Land - UI/UX Test Suite</h1>
        <p class="subtitle">Comprehensive testing for interface quality, accessibility, and performance</p>

        <button class="run-tests-btn" onclick="runAllTests()">▶ Run All Tests</button>

        <div class="summary" id="summary">
            <div class="summary-card pass">
                <div class="summary-number" id="passCount">0</div>
                <div class="summary-label">Passed</div>
            </div>
            <div class="summary-card fail">
                <div class="summary-number" id="failCount">0</div>
                <div class="summary-label">Failed</div>
            </div>
            <div class="summary-card warning">
                <div class="summary-number" id="warningCount">0</div>
                <div class="summary-label">Warnings</div>
            </div>
        </div>

        <div id="testResults"></div>
    </div>

    <script>
        let passCount = 0;
        let failCount = 0;
        let warningCount = 0;

        function runAllTests() {
            // Reset counters
            passCount = 0;
            failCount = 0;
            warningCount = 0;

            const resultsContainer = document.getElementById('testResults');
            resultsContainer.innerHTML = '';

            // Run all test categories
            testAccessibility();
            testResponsiveDesign();
            testPerformance();
            testSEO();
            testInteractivity();
            testVisualDesign();
            testContentQuality();
            testBrowserCompatibility();

            // Update summary
            document.getElementById('passCount').textContent = passCount;
            document.getElementById('failCount').textContent = failCount;
            document.getElementById('warningCount').textContent = warningCount;
        }

        function addTestSection(title, tests) {
            const resultsContainer = document.getElementById('testResults');
            const section = document.createElement('div');
            section.className = 'test-section';
            section.innerHTML = `<h2>${title}</h2>`;

            tests.forEach(test => {
                const testCase = document.createElement('div');
                testCase.className = `test-case ${test.status}`;
                testCase.innerHTML = `
                    <div class="test-title">
                        <span class="badge ${test.status}">${test.status}</span>
                        ${test.title}
                    </div>
                    <div class="test-description">${test.description}</div>
                    ${test.result ? `<div class="test-result">${test.result}</div>` : ''}
                    ${test.code ? `<div class="code">${test.code}</div>` : ''}
                `;
                section.appendChild(testCase);

                // Update counters
                if (test.status === 'pass') passCount++;
                else if (test.status === 'fail') failCount++;
                else if (test.status === 'warning') warningCount++;
            });

            resultsContainer.appendChild(section);
        }

        function testAccessibility() {
            const tests = [
                {
                    status: 'fail',
                    title: 'Color Contrast - Hero Text',
                    description: 'Test if hero section text has sufficient contrast ratio (WCAG AA)',
                    result: 'FAIL: Gold text (#C5A059) on dark green background (#003d33) has contrast ratio of ~3.2:1. Minimum required: 4.5:1',
                    code: 'Recommendation: Use #E5C888 (lighter gold) for better readability'
                },
                {
                    status: 'warning',
                    title: 'Alt Text for Images',
                    description: 'Check if all images have descriptive alt attributes',
                    result: 'WARNING: Floor plan images use generic alt text. Should be more descriptive for screen readers.',
                    code: 'Example: alt="Mặt bằng căn hộ 2 phòng ngủ 75m² với phòng khách rộng rãi"'
                },
                {
                    status: 'pass',
                    title: 'Semantic HTML Structure',
                    description: 'Verify proper use of semantic HTML5 elements',
                    result: 'PASS: Document uses proper semantic elements (header, nav, section, footer, article)'
                },
                {
                    status: 'fail',
                    title: 'Keyboard Navigation',
                    description: 'Test if all interactive elements are keyboard accessible',
                    result: 'FAIL: Mobile menu toggle button missing keyboard support and aria-label',
                    code: 'Add: aria-label="Menu" and proper focus states'
                },
                {
                    status: 'warning',
                    title: 'Focus Indicators',
                    description: 'Check if focus states are visible for keyboard users',
                    result: 'WARNING: Custom focus styles not defined. Using browser defaults which may not match design.',
                    code: ':focus { outline: 2px solid #C5A059; outline-offset: 2px; }'
                },
                {
                    status: 'fail',
                    title: 'ARIA Labels for Icons',
                    description: 'Icon-only buttons need accessible labels',
                    result: 'FAIL: Swiper navigation buttons and floating hotline lack aria-labels',
                    code: 'Example: aria-label="Slide tiếp theo"'
                }
            ];

            addTestSection('♿ Accessibility Tests', tests);
        }

        function testResponsiveDesign() {
            const tests = [
                {
                    status: 'pass',
                    title: 'Mobile Viewport Meta Tag',
                    description: 'Check for proper viewport configuration',
                    result: 'PASS: Viewport meta tag properly configured'
                },
                {
                    status: 'warning',
                    title: 'Hero Section Height on Mobile',
                    description: 'Test hero section usability on mobile devices',
                    result: 'WARNING: Hero section is 100vh which may cause issues on iOS Safari with address bar',
                    code: 'Consider: min-height: 100vh; height: auto; for better mobile UX'
                },
                {
                    status: 'pass',
                    title: 'Touch Target Sizes',
                    description: 'Verify interactive elements are at least 44x44px',
                    result: 'PASS: Buttons and links meet minimum touch target size requirements'
                },
                {
                    status: 'warning',
                    title: 'Trust Bar Readability',
                    description: 'Test if trust bar numbers are readable on small screens',
                    result: 'WARNING: Trust bar numbers (42px) might be too large for very small devices (<375px)',
                    code: 'Add media query for screens < 375px: font-size: 32px;'
                },
                {
                    status: 'pass',
                    title: 'Responsive Grid Layout',
                    description: 'Check if grids adapt properly to different screen sizes',
                    result: 'PASS: CSS Grid with auto-fit and proper breakpoints'
                },
                {
                    status: 'fail',
                    title: 'Horizontal Scrolling',
                    description: 'Check for unwanted horizontal scroll on mobile',
                    result: 'FAIL: Floor plan images may cause horizontal scroll on devices < 375px',
                    code: 'Add: img { max-width: 100%; height: auto; }'
                }
            ];

            addTestSection('📱 Responsive Design Tests', tests);
        }

        function testPerformance() {
            const tests = [
                {
                    status: 'warning',
                    title: 'External Font Loading',
                    description: 'Test font loading strategy',
                    result: 'WARNING: Loading 4 font families from Google Fonts may impact initial load time',
                    code: 'Consider: font-display: swap; or preload critical fonts'
                },
                {
                    status: 'fail',
                    title: 'Three.js Bundle Size',
                    description: 'Check if 3D library is necessary',
                    result: 'FAIL: Three.js (r128) adds ~500KB. Consider lighter alternatives or lazy loading',
                    code: 'Alternative: Use CSS animations or load Three.js only when hero is in viewport'
                },
                {
                    status: 'pass',
                    title: 'Image Lazy Loading',
                    description: 'Verify images use native lazy loading',
                    result: 'PASS: Images use loading="lazy" attribute'
                },
                {
                    status: 'warning',
                    title: 'Animation Performance',
                    description: 'Check if animations use GPU-accelerated properties',
                    result: 'WARNING: Some animations use non-compositor properties (opacity, blur)',
                    code: 'Use transform and opacity for better performance'
                },
                {
                    status: 'fail',
                    title: 'Unused CSS',
                    description: 'Check for unused CSS rules',
                    result: 'FAIL: Multiple unused utility classes and duplicate styles detected',
                    code: 'Run CSS purge or audit to remove ~30% unused styles'
                },
                {
                    status: 'pass',
                    title: 'Debounce/Throttle on Scroll',
                    description: 'Verify scroll handlers are optimized',
                    result: 'PASS: Scroll handlers use debounce/throttle functions'
                }
            ];

            addTestSection('⚡ Performance Tests', tests);
        }

        function testSEO() {
            const tests = [
                {
                    status: 'pass',
                    title: 'Meta Description',
                    description: 'Check for descriptive meta description',
                    result: 'PASS: Meta description present and well-written (160 characters)'
                },
                {
                    status: 'pass',
                    title: 'Open Graph Tags',
                    description: 'Verify social media preview tags',
                    result: 'PASS: OG tags properly configured for Facebook/LinkedIn sharing'
                },
                {
                    status: 'warning',
                    title: 'H1 Hierarchy',
                    description: 'Check heading structure',
                    result: 'WARNING: Multiple H2s before any H1 in stats section. Maintain logical hierarchy.',
                    code: 'Consider wrapping stats in semantic structure'
                },
                {
                    status: 'fail',
                    title: 'Missing Structured Data',
                    description: 'Check for Schema.org markup',
                    result: 'FAIL: No structured data (JSON-LD) for local business, real estate listings',
                    code: 'Add LocalBusiness and RealEstateListing schema'
                },
                {
                    status: 'pass',
                    title: 'Canonical URL',
                    description: 'Verify canonical link tag',
                    result: 'PASS: Would benefit from canonical URL for SEO'
                },
                {
                    status: 'warning',
                    title: 'Image URLs',
                    description: 'Check if image URLs are SEO-friendly',
                    result: 'WARNING: Some images use encoded URLs (mat%20bang%20mau/) - should use hyphens',
                    code: 'Rename: mat-bang-mau/ for better SEO'
                }
            ];

            addTestSection('🔍 SEO Tests', tests);
        }

        function testInteractivity() {
            const tests = [
                {
                    status: 'pass',
                    title: 'Smooth Scrolling',
                    description: 'Test anchor link smooth scrolling',
                    result: 'PASS: Smooth scroll implemented for anchor links with header offset'
                },
                {
                    status: 'warning',
                    title: 'Mobile Menu Close',
                    description: 'Test if mobile menu closes on outside click',
                    result: 'WARNING: Mobile menu closes on outside click, but animation could be smoother',
                    code: 'Add transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);'
                },
                {
                    status: 'fail',
                    title: 'Form Validation',
                    description: 'Check if forms have proper validation',
                    result: 'FAIL: No contact form present on main page. CTA only links to phone/details',
                    code: 'Consider adding inline contact form for lead generation'
                },
                {
                    status: 'pass',
                    title: 'Hover States',
                    description: 'Verify all interactive elements have hover states',
                    result: 'PASS: All buttons, links, and cards have defined hover states'
                },
                {
                    status: 'warning',
                    title: 'Loading States',
                    description: 'Check for loading indicators',
                    result: 'WARNING: Page loader exists but no loading states for dynamic content',
                    code: 'Add skeleton screens or spinners for async content'
                },
                {
                    status: 'pass',
                    title: 'Swiper Navigation',
                    description: 'Test slider controls functionality',
                    result: 'PASS: Swiper configured with navigation, pagination, and autoplay'
                }
            ];

            addTestSection('🖱️ Interactivity Tests', tests);
        }

        function testVisualDesign() {
            const tests = [
                {
                    status: 'pass',
                    title: 'Brand Consistency',
                    description: 'Check color scheme consistency',
                    result: 'PASS: Color variables well-defined and consistently used'
                },
                {
                    status: 'warning',
                    title: 'Typography Hierarchy',
                    description: 'Test font size and weight hierarchy',
                    result: 'WARNING: Some text sizes very similar (15px vs 16px) - could simplify',
                    code: 'Consider using type scale with more distinct sizes'
                },
                {
                    status: 'fail',
                    title: 'Glass Morphism Contrast',
                    description: 'Check readability of glass morphism elements',
                    result: 'FAIL: Some glass-morphism cards have poor text contrast (trust bar)',
                    code: 'Increase backdrop opacity or add darker background overlay'
                },
                {
                    status: 'pass',
                    title: 'Spacing Consistency',
                    description: 'Verify consistent spacing system',
                    result: 'PASS: CSS variables define consistent spacing scale'
                },
                {
                    status: 'warning',
                    title: 'Button Size Consistency',
                    description: 'Check if buttons have consistent sizing',
                    result: 'WARNING: Multiple button sizes (padding variations) - standardize to 2-3 sizes',
                    code: 'Define: btn-sm, btn-md, btn-lg variants'
                },
                {
                    status: 'pass',
                    title: 'Icon Alignment',
                    description: 'Verify icons align properly with text',
                    result: 'PASS: Icons use flexbox alignment and consistent sizing'
                }
            ];

            addTestSection('🎨 Visual Design Tests', tests);
        }

        function testContentQuality() {
            const tests = [
                {
                    status: 'pass',
                    title: 'Vietnamese Language Support',
                    description: 'Check proper Vietnamese font and character support',
                    result: 'PASS: Using Be Vietnam Pro font with proper Vietnamese character support'
                },
                {
                    status: 'warning',
                    title: 'Content Loading',
                    description: 'Test if content loads from external files',
                    result: 'WARNING: Projects and news data loaded from data.js - no fallback for load failures',
                    code: 'Add error handling and fallback content in HTML'
                },
                {
                    status: 'fail',
                    title: 'Missing Avatar Images',
                    description: 'Check if referenced images exist',
                    result: 'FAIL: Social proof avatars (avatar1.jpg, avatar2.jpg, avatar3.jpg) likely missing',
                    code: 'Verify images exist or use placeholder service'
                },
                {
                    status: 'pass',
                    title: 'Phone Number Formatting',
                    description: 'Verify consistent phone number format',
                    result: 'PASS: Phone number consistently formatted as 0903.469.888'
                },
                {
                    status: 'warning',
                    title: 'News Detail Content',
                    description: 'Check if news articles have full content',
                    result: 'WARNING: News detail shows "Nội dung đang được cập nhật" - needs actual content',
                    code: 'Populate news articles with full content'
                },
                {
                    status: 'pass',
                    title: 'CTA Clarity',
                    description: 'Verify call-to-action buttons are clear',
                    result: 'PASS: CTAs are clear and action-oriented ("Khám Phá", "Tư Vấn Ngay", "Gọi Ngay")'
                }
            ];

            addTestSection('📝 Content Quality Tests', tests);
        }

        function testBrowserCompatibility() {
            const tests = [
                {
                    status: 'pass',
                    title: 'CSS Vendor Prefixes',
                    description: 'Check for webkit prefixes',
                    result: 'PASS: Backdrop-filter has -webkit- prefix for Safari support'
                },
                {
                    status: 'warning',
                    title: 'Three.js Fallback',
                    description: 'Test if 3D background has fallback',
                    result: 'WARNING: Three.js background has console.warn fallback but no visual fallback',
                    code: 'Add CSS gradient fallback in hero-background class'
                },
                {
                    status: 'pass',
                    title: 'IntersectionObserver Check',
                    description: 'Verify API availability check',
                    result: 'PASS: Lazy loading checks for IntersectionObserver support'
                },
                {
                    status: 'fail',
                    title: 'IE11 Support',
                    description: 'Check compatibility with older browsers',
                    result: 'FAIL: Uses CSS Grid, CSS Variables, and modern JS without polyfills',
                    code: 'If IE11 support needed, add polyfills or show upgrade message'
                },
                {
                    status: 'pass',
                    title: 'Mobile Safari -webkit-overflow-scrolling',
                    description: 'Check for smooth scrolling on iOS',
                    result: 'PASS: Should work well with default settings in modern iOS'
                },
                {
                    status: 'warning',
                    title: 'Backdrop Filter Support',
                    description: 'Check fallback for unsupported browsers',
                    result: 'WARNING: Backdrop-filter not supported in Firefox (desktop) until v103',
                    code: 'Add @supports check with solid background fallback'
                }
            ];

            addTestSection('🌐 Browser Compatibility Tests', tests);
        }

        // Auto-run tests on load
        window.addEventListener('load', () => {
            setTimeout(runAllTests, 500);
        });
    </script>
</body>
</html>
