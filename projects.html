<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
    <title>Dự Án Showroom - Thạch Vũ Land</title>

    <!-- Styles -->
    <link rel="stylesheet" href="styles/anthropic.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <!-- Header -->
    <header class="site-header scrolled">
        <div class="container header-container">
            <a href="index.html" class="logo">TVL<span>.</span></a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Trang Chủ</a>
                <a href="projects.html" class="nav-link active">Dự Án</a>
                <a href="news-anthropic.html" class="nav-link">Tin Tức</a>
                <a href="index.html#about" class="nav-link">Về Chúng Tôi</a>
                <a href="tel:0903469888" class="nav-link nav-cta">Liên Hệ</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="news-hero-modern">
        <div class="container" style="text-align: center;">
            <span class="category-tag">Premium Collection</span>
            <h1 class="article-title-large">Dự Án Bất Động Sản</h1>
            <p class="article-body" style="max-width: 700px; margin: 0 auto;">Khám phá bộ sưu tập các dự án cao cấp, vị
                trí đắc địa và tiềm năng sinh lời bền vững được tuyển chọn bởi Thạch Vũ Land.</p>
        </div>
    </section>

    <!-- Filter Bar -->
    <section class="container filter-section">
        <div class="filter-pills" id="projectFilter">
            <button class="filter-pill active" data-category="all">Tất Cả</button>
            <button class="filter-pill" data-category="can-ho">Căn Hộ</button>
            <button class="filter-pill" data-category="shophouse">Shophouse</button>
            <button class="filter-pill" data-category="dat-nen">Đất Nền</button>
        </div>
    </section>

    <!-- Bento Grid -->
    <section class="container">
        <div class="projects-bento-grid" id="projectsBentoGrid">
            <!-- Rendered via JS -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Thạch Vũ Land. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Data & Scripts -->
    <script src="scripts/data.js"></script>
    <script src="scripts/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('projectsBentoGrid');
            const filterContainer = document.getElementById('projectFilter');

            function renderProjects(category = 'all') {
                const filtered = category === 'all'
                    ? projectData
                    : projectData.filter(p => p.category === category);

                grid.innerHTML = filtered.map((project, index) => {
                    // Logic for Bento patterns (e.g., every 3rd or 4th is wide/tall)
                    let modifier = '';
                    if (index % 5 === 0) modifier = 'project-card--wide';
                    else if (index % 5 === 3) modifier = 'project-card--tall';

                    return `
                        <div class="project-card ${modifier}">
                            <div class="project-card__image-wrapper">
                                <img src="${project.image}" alt="${project.title}" class="project-card__image" loading="lazy">
                                <div class="project-card__badge">${project.status}</div>
                            </div>
                            <div class="project-card__content">
                                <div class="project-card__category">${project.category === 'can-ho' ? 'Căn Hộ' : 'Shophouse'}</div>
                                <h3 class="project-card__title">${project.title}</h3>
                                <div class="project-card__meta">
                                    <div class="project-card__meta-item">
                                        <i class="fas fa-map-marker-alt"></i>
                                        <span>${project.location}</span>
                                    </div>
                                    <div class="project-card__meta-item">
                                        <i class="fas fa-tag"></i>
                                        <span class="price-text">${project.price}</span>
                                    </div>
                                </div>
                                <a href="${project.link}" class="nav-cta" style="display: inline-block; margin-top: 24px; text-decoration: none;">Chi tiết</a>
                            </div>
                        </div>
                    `;
                }).join('');

                // Animation
                gsap.from(".project-card", {
                    y: 40,
                    opacity: 0,
                    duration: 0.6,
                    stagger: 0.1,
                    ease: "power2.out"
                });
            }

            // Filter logic
            filterContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-pill')) {
                    document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    renderProjects(e.target.dataset.category);
                }
            });

            renderProjects();
        });
    </script>
</body>

</html>
