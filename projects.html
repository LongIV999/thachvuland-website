<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
    <title>Dự Án Showroom - Thạch Vũ Land</title>

    <!-- Styles -->
    <link rel="stylesheet" href="styles/anthropic.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <!-- Header -->
    <header class="site-header scrolled" id="siteHeader">
        <div class="header-container container">
            <a href="index.html" class="logo">THACH VU <span>LAND</span></a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Trang Chủ</a>
                <a href="projects.html" class="nav-link active">Dự Án</a>
                <a href="news-anthropic.html" class="nav-link">Tin Tức</a>
                <a href="about.html" class="nav-link">Về Chúng Tôi</a>
                <a href="contact.html" class="nav-link nav-cta">Liên Hệ</a>
            </nav>
            <div class="mobile-menu-btn" id="mobileMenuToggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="news-hero-modern">
        <div class="container" style="text-align: center;">
            <span class="category-tag">Premium Collection</span>
            <h1 class="article-title-large">Dự Án Bất Động Sản</h1>
            <p class="article-body" style="max-width: 700px; margin: 0 auto;">Khám phá bộ sưu tập các dự án cao cấp, vị
                trí đắc địa và tiềm năng sinh lời bền vững được tuyển chọn bởi Thạch Vũ Land.</p>
        </div>
    </section>

    <!-- Filter Bar -->
    <section class="container filter-section">
        <div class="smart-filter-bar">
            <!-- Search -->
            <div class="filter-group" style="flex: 2;">
                <label class="filter-label">Tìm kiếm</label>
                <div style="position: relative;">
                    <i class="fas fa-search"
                        style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--anthropic-mid-gray);"></i>
                    <input type="text" id="searchInput" class="filter-input"
                        placeholder="Nhập tên dự án hoặc khu vực..." style="padding-left: 40px;">
                </div>
            </div>

            <!-- Type -->
            <div class="filter-group">
                <label class="filter-label">Loại Hình</label>
                <select id="typeSelect" class="filter-select">
                    <option value="all">Tất cả</option>
                    <option value="can-ho">Căn Hộ</option>
                    <option value="shophouse">Shophouse</option>
                    <option value="dat-nen">Đất Nền</option>
                </select>
            </div>

            <!-- Location -->
            <div class="filter-group">
                <label class="filter-label">Khu Vực</label>
                <select id="locationSelect" class="filter-select">
                    <option value="all">Tất cả</option>
                    <option value="Bình Dương">Bình Dương</option>
                    <option value="TP.HCM">TP.HCM</option>
                </select>
            </div>

            </select>
        </div>

        <!-- Price Range -->
        <div class="filter-group" style="flex: 1.5;">
            <label class="filter-label">Mức Giá</label>
            <div class="price-range-inputs">
                <input type="number" id="minPrice" class="filter-input-small" placeholder="Từ (Tỷ)">
                <span style="color: var(--anthropic-mid-gray);">-</span>
                <input type="number" id="maxPrice" class="filter-input-small" placeholder="Đến (Tỷ)">
            </div>
        </div>

        <!-- Status -->
        <div class="filter-group">
            <label class="filter-label">Trạng Thái</label>
            <select id="statusSelect" class="filter-select">
                <option value="all">Tất cả</option>
                <option value="Sắp Mở Bán">Sắp Mở Bán</option>
                <option value="Đang Booking">Đang Booking</option>
                <option value="Đang Bàn Giao">Đang Bàn Giao</option>
            </select>
        </div>

        <!-- Clear Action -->
        <button class="filter-clear-btn" id="clearFiltersBtn" title="Xóa bộ lọc">
            <i class="fas fa-sync-alt"></i>
        </button>
        </div>
    </section>

    <!-- Bento Grid -->
    <section class="container">
        <div class="projects-bento-grid" id="projectsBentoGrid">
            <!-- Rendered via JS -->
        </div>
        <div id="noResults" style="text-align: center; padding: 60px; display: none;">
            <i class="fas fa-search"
                style="font-size: 3rem; color: var(--anthropic-light-gray); margin-bottom: 20px;"></i>
            <p class="article-body">Không tìm thấy dự án phù hợp.</p>
            <button class="nav-cta" onclick="resetFilters()">Xóa bộ lọc</button>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Thạch Vũ Land. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Data & Scripts -->
    <script src="scripts/data.js"></script>
    <script src="scripts/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('projectsBentoGrid');
            const noResults = document.getElementById('noResults');

            // Inputs
            const searchInput = document.getElementById('searchInput');
            const typeSelect = document.getElementById('typeSelect');
            const locationSelect = document.getElementById('locationSelect');
            const statusSelect = document.getElementById('statusSelect');
            const minPriceInput = document.getElementById('minPrice');
            const maxPriceInput = document.getElementById('maxPrice');
            const clearBtn = document.getElementById('clearFiltersBtn');

            function parsePrice(priceStr) {
                if (!priceStr) return 0;
                // "5.5 Tỷ" -> 5.5
                // "35 Triệu/m2" -> (Handling per m2 might be tricky, for now assume Tỷ is main filter or just ignore unit)
                // Let's extract first number
                const match = priceStr.match(/[\d\.]+/);
                return match ? parseFloat(match[0]) : 0;
            }

            function filterProjects() {
                const kw = searchInput.value.toLowerCase();
                const type = typeSelect.value;
                const loc = locationSelect.value;
                const status = statusSelect.value;
                const minPrice = parseFloat(minPriceInput.value) || 0;
                const maxPrice = parseFloat(maxPriceInput.value) || Infinity;

                const filtered = projectData.filter(p => {
                    const matchKw = !kw || p.title.toLowerCase().includes(kw) || p.location.toLowerCase().includes(kw);
                    const matchType = type === 'all' || p.category === type;
                    const matchLoc = loc === 'all' || p.location.includes(loc);
                    const matchStatus = status === 'all' || p.status === status;

                    // Simple Price Logic: matches if "Tỷ" is in string, or just check numeric value
                    // If unit is "Triệu/m2", this user might be filtering for Total Price in Billions. 
                    // For MVP: We only filter items that clearly look like "X Tỷ" if user enters range.
                    let matchPrice = true;
                    if (minPrice > 0 || maxPrice < Infinity) {
                        const pVal = parsePrice(p.price);
                        // Heuristic: If price < 100, assume Tỷ. If > 100 (like 500 Triệu), handle optionally. 
                        // For now, assuming user types Tỷ. 
                        matchPrice = pVal >= minPrice && pVal <= maxPrice;
                    }

                    return matchKw && matchType && matchLoc && matchStatus && matchPrice;
                });

                renderGrid(filtered);
            }

            function renderGrid(projects) {
                if (projects.length === 0) {
                    grid.style.display = 'none';
                    noResults.style.display = 'block';
                    return;
                }

                grid.style.display = 'grid';
                noResults.style.display = 'none';

                grid.innerHTML = projects.map((project, index) => {
                    let modifier = '';
                    // Bento Logic: 
                    // 1st item: Tall (row-span-2)
                    // 4th item: Wide (col-span-2)
                    // 6th item: Big (col-span-2 row-span-2)
                    // This is a simple pattern loop every 8 items
                    const patternIndex = index % 8;
                    if (patternIndex === 0) modifier = 'project-card--tall';
                    else if (patternIndex === 3) modifier = 'project-card--wide';
                    else if (patternIndex === 6) modifier = 'project-card--wide';

                    return `
                        <div class="project-card ${modifier}">
                            <div class="project-card__image-wrapper">
                                <img src="${project.image}" alt="${project.title}" class="project-card__image" loading="lazy">
                                <div class="project-card__badge">${project.status}</div>
                            </div>
                            <div class="project-card__content">
                                <div class="project-card__category">${project.category === 'can-ho' ? 'Căn Hộ' : (project.category === 'shophouse' ? 'Shophouse' : 'Đất Nền')}</div>
                                <h3 class="project-card__title">${project.title}</h3>
                                <div class="project-card__meta">
                                    <div class="project-card__meta-item">
                                        <i class="fas fa-map-marker-alt"></i>
                                        <span>${project.location}</span>
                                    </div>
                                    <div class="project-card__meta-item">
                                        <i class="fas fa-tag"></i>
                                        <span class="price-text">${project.price}</span>
                                    </div>
                                </div>
                                <a href="project-detail.html?id=${project.id}" class="nav-cta" style="display: inline-block; margin-top: 24px; text-decoration: none;">Chi tiết</a>
                            </div>
                        </div>
                    `;
                }).join('');

                // Animation reset (Debounced or targeted to avoid heavy re-runs)
                // Just animate opacity for smoother feel
                gsap.fromTo("#projectsBentoGrid .project-card",
                    { opacity: 0, y: 10 },
                    { opacity: 1, y: 0, duration: 0.3, stagger: 0.05, clearProps: "all" }
                );
            }

            // Events
            [typeSelect, locationSelect, statusSelect, minPriceInput, maxPriceInput].forEach(el => {
                el.addEventListener('change', filterProjects);
                if (el.tagName === 'INPUT') el.addEventListener('input', filterProjects);
            });
            searchInput.addEventListener('input', filterProjects);

            // Global reset
            window.resetFilters = () => {
                searchInput.value = '';
                typeSelect.value = 'all';
                locationSelect.value = 'all';
                statusSelect.value = 'all';
                minPriceInput.value = '';
                maxPriceInput.value = '';
                filterProjects();
            };

            clearBtn.addEventListener('click', () => {
                window.resetFilters();
                // Add rotation animation
                gsap.from(clearBtn.querySelector('i'), { rotation: 360, duration: 0.5 });
            });

            // Init
            filterProjects();
        });
    </script>
</body>

</html>
