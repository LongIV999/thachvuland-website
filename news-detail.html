<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin Tức - Thạch Vũ Land</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Cinzel:wght@400;700;900&display=swap"
        rel="stylesheet">

    <!-- Icons & Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles/main.css">

    <style>
        .news-detail-page {
            padding-top: 100px;
            padding-bottom: 80px;
            background: #ffffff;
            /* Light theme for reading */
        }

        .article-header {
            margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
        }

        .article-category {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-600);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: inline-block;
        }

        .article-title {
            font-family: var(--font-heading);
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--neutral-900);
            line-height: 1.2;
            margin-bottom: 20px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .article-meta {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 14px;
            color: var(--neutral-500);
            margin-bottom: 30px;
        }

        .article-featured-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 50px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .article-content {
            font-size: 18px;
            line-height: 1.8;
            color: var(--neutral-700);
            max-width: 800px;
            margin: 0 auto;
        }

        .article-content p {
            margin-bottom: 25px;
        }

        .article-content h2 {
            font-size: 1.8rem;
            margin-top: 40px;
            margin-bottom: 20px;
            color: var(--primary-900);
        }

        .related-section {
            padding: 80px 0;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            margin-top: 80px;
        }

        .author-box {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 60px;
            padding: 30px;
            background: #f9f9f9;
            border-radius: 12px;
            border: 1px solid #eee;
        }

        .author-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Responsive override */
        @media (max-width: 768px) {
            .article-featured-image {
                height: 300px;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="site-header scrolled">
        <div class="header-container">
            <a href="index.html" class="logo">
                <span class="cinzel" style="color: var(--primary-900)">THẠCH VŨ</span>
                <span class="logo-sub" style="color: var(--accent-gold)">LAND</span>
            </a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Trang chủ</a>
                <a href="index.html#projects" class="nav-link">Dự án</a>
                <a href="news.html" class="nav-link">Tin tức</a>
            </nav>
        </div>
    </header>

    <main class="news-detail-page">
        <div class="container" id="newsDetailContainer">
            <!-- Rendered via JS -->
            <div style="text-align: center; padding: 100px;">
                <i class="fas fa-spinner fa-spin" style="font-size: 30px; color: var(--accent-gold);"></i>
            </div>
        </div>
    </main>

    <!-- Related News -->
    <section class="related-section">
        <div class="container">
            <h3 class="section-title text-center">Tin Liên Quan</h3>
            <div class="news-grid-modern" id="relatedNewsGrid"
                style="grid-template-columns: repeat(3, 1fr); margin-top: 40px;">
                <!-- JS -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer" style="background: var(--primary-900); color: white; padding: 40px 0;">
        <div class="container">
            <p class="text-center">&copy; 2026 Thạch Vũ Land. All rights reserved.</p>
        </div>
    </footer>

    <script src="scripts/data.js"></script>
    <script>
        // Check ID
        const urlParams = new URLSearchParams(window.location.search);
        const newsId = parseInt(urlParams.get('id')) || 1; // Default to ID 1 if null

        const detailContainer = document.getElementById('newsDetailContainer');
        const relatedGrid = document.getElementById('relatedNewsGrid');

        // Find Articles
        const article = newsData.find(item => item.id === newsId);

        if (article) {
            // Render Article
            detailContainer.innerHTML = `
                <article>
                    <header class="article-header">
                        <span class="article-category">${article.category}</span>
                        <h1 class="article-title">${article.title}</h1>
                        <div class="article-meta">
                            <span><i class="fas fa-calendar"></i> ${article.date}</span>
                            <span><i class="fas fa-user"></i> ${article.author}</span>
                            <span><i class="fas fa-clock"></i> 5 phút đọc</span>
                        </div>
                    </header>

                    <img src="${article.image}" alt="${article.title}" class="article-featured-image">

                    <div class="article-content">
                        <p style="font-size: 1.25rem; font-weight: 500; color: var(--primary-900); margin-bottom: 30px;">
                            ${article.excerpt}
                        </p>
                        ${article.content}
                        
                        <div class="author-box">
                             <img src="https://randomuser.me/api/portraits/men/32.jpg" class="author-avatar">
                             <div>
                                <h4 style="margin: 0; color: var(--primary-900)">${article.author}</h4>
                                <p style="margin: 0; font-size: 13px; color: #666;">Chuyên gia phân tích bất động sản</p>
                             </div>
                        </div>
                    </div>
                </article>
            `;

            // Render Related (Simple logic: Same category or random)
            const related = newsData.filter(item => item.id !== newsId).slice(0, 3);
            related.forEach(item => {
                relatedGrid.insertAdjacentHTML('beforeend', `
                    <article class="article-card-modern">
                        <div class="img-wrapper">
                            <a href="news-detail.html?id=${item.id}">
                                <img src="${item.image}" alt="${item.title}">
                            </a>
                        </div>
                        <div class="content">
                             <span style="font-size: 11px; font-weight: 600; color: var(--primary-600);">${item.category}</span>
                             <h4 style="margin: 5px 0;"><a href="news-detail.html?id=${item.id}">${item.title}</a></h4>
                        </div>
                    </article>
                 `);
            });

        } else {
            detailContainer.innerHTML = '<h1>Không tìm thấy bài viết</h1>';
        }
    </script>
</body>

</html>
