<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Anthropic Style</title>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Anthropic Theme Styles -->
    <link rel="stylesheet" href="styles/anthropic.css">
</head>

<body>
    <!-- Header (Consistent with news-anthropic.html) -->
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo">
                THACH VU
            </a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Overview</a>
                <a href="index.html#projects" class="nav-link">Projects</a>
                <a href="news-anthropic.html" class="nav-link active">Analysis</a>
                <a href="index.html#contact" class="nav-link nav-cta">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Article Content -->
    <main id="articleContainer">
        <!-- Rendered via JS -->
    </main>

    <!-- Related Section -->
    <section class="news-portal-section" style="background: var(--anthropic-light-gray); padding-top: 80px;">
        <div class="container">
            <h3
                style="font-family: var(--font-heading); margin-bottom: 40px; border-bottom: 1px solid var(--anthropic-mid-gray); padding-bottom: 20px;">
                Related Intelligence
            </h3>
            <div class="news-portal-grid">
                <!-- We will reuse the list style or create a simple grid for related -->
                <div class="news-grid-modern" id="relatedGrid"
                    style="grid-template-columns: repeat(3, 1fr); display: grid; gap: 40px; grid-column: span 2;">
                    <!-- JS -->
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
                <div>
                    <h4 style="font-size: 1.25rem; color: white;">Thach Vu Land</h4>
                    <p style="max-width: 400px; color: var(--anthropic-mid-gray);">
                        Providing data-driven real estate analysis and investment consulting.
                    </p>
                </div>
            </div>
            <div class="footer-bottom">
                &copy; 2026 Thach Vu Land. Styled with Anthropic Guidelines.
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="scripts/data.js"></script>
    <script>
        // Check ID
        const urlParams = new URLSearchParams(window.location.search);
        const newsId = parseInt(urlParams.get('id')) || 1;

        const container = document.getElementById('articleContainer');
        const relatedContainer = document.getElementById('relatedGrid');

        // Find Article
        const article = newsData.find(item => item.id === newsId);

        if (article) {
            container.innerHTML = `
                <article class="article-detail-container">
                    <header class="article-header">
                        <div style="margin-bottom: 24px;">
                            <a href="news-anthropic.html" class="nav-link" style="text-decoration: none; font-size: 14px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; gap: 8px;">
                                <i class="fas fa-arrow-left"></i> Quay lại tin tức
                            </a>
                        </div>
                        <span class="article-category-label">${article.category}</span>
                        <h1 class="article-title-large">${article.title}</h1>
                        <div class="article-meta-modern">
                            <span>${article.date}</span>
                            <span>&bull;</span>
                            <span>${article.author}</span>
                            <span>&bull;</span>
                            <span>5 min read</span>
                        </div>
                    </header>

                    <img src="${article.image}" alt="${article.title}" class="article-feature-img">

                    <div class="article-body">
                        <p style="font-size: 1.4rem; color: var(--text-primary); font-weight: 500;">
                            ${article.excerpt}
                        </p>
                        ${article.content}

                        <div class="author-box-modern">
                            <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="${article.author}">
                            <div>
                                <h4 style="font-family: var(--font-heading); margin-bottom: 4px;">${article.author}</h4>
                                <p style="font-size: 14px; color: var(--text-secondary); margin: 0;">Senior Market Analyst</p>
                            </div>
                        </div>
                    </div>
                </article>
            `;

            // Render Related
            const related = newsData.filter(item => item.id !== newsId).slice(0, 3);
            related.forEach(item => {
                const card = `
                     <article class="article-card" style="flex-direction: column; gap: 16px; margin: 0;">
                        <div class="article-card__image-container" style="width: 100%;">
                            <a href="news-detail.html?id=${item.id}">
                                <img src="${item.image}" alt="${item.title}" class="article-card__image" style="aspect-ratio: 16/9;">
                            </a>
                        </div>
                        <div class="article-card__content">
                            <span class="category-tag" style="color: var(--anthropic-blue); font-size: 11px;">${item.category}</span>
                            <h3 class="article-card__title" style="font-size: 1.2rem; margin-top: 8px;">
                                <a href="news-detail.html?id=${item.id}">${item.title}</a>
                            </h3>
                        </div>
                    </article>
                `;
                relatedContainer.insertAdjacentHTML('beforeend', card);
            });

        } else {
            container.innerHTML = '<div style="text-align: center; padding: 100px;"><h1>Article not found</h1></div>';
        }
    </script>
</body>

</html>
